<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИГРА</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    min-height: 100vh;
    padding: 20px;
  }

  .screen.active { display: flex; }

  /* ===== ГЛАВНОЕ МЕНЮ ===== */
  #menu img {
    width: min(50vw, 300px);
    border-radius: 20px;
    box-shadow: 0 0 60px rgba(255, 0, 80, 0.35);
    margin-bottom: 40px;
  }

  #startBtn {
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 900;
    text-transform: uppercase;
    padding: 18px 60px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff0050, #ff7b00);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(255, 0, 80, 0.5);
    transition: transform 0.15s, box-shadow 0.15s;
    animation: pulse 1.6s infinite;
  }

  #startBtn:hover {
    transform: scale(1.08);
    box-shadow: 0 10px 40px rgba(255, 0, 80, 0.8);
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 30px rgba(255, 0, 80, 0.5); }
    50%      { box-shadow: 0 8px 45px rgba(255, 0, 80, 0.9); }
  }

  /* ===== ЭКРАН ПОБЕДЫ ===== */
  .photos-row {
    display: flex;
    gap: 20px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  #game img {
    width: min(40vw, 350px);
    border-radius: 20px;
    box-shadow: 0 0 80px rgba(0, 200, 255, 0.35);
    animation: pop 0.5s ease-out;
  }

  #game h1 {
    font-size: clamp(34px, 9vw, 80px);
    font-weight: 900;
    text-transform: uppercase;
    color: #ff2255;
    text-shadow: 0 0 30px rgba(255, 34, 85, 0.8);
    margin-top: 30px;
    animation: shake 0.6s ease-in-out infinite;
    letter-spacing: 2px;
  }

  @keyframes pop {
    0%   { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(-2deg) scale(1.03); }
    75%      { transform: rotate(2deg) scale(1.03); }
  }
</style>
</head>
<body>

  <!-- ГЛАВНОЕ МЕНЮ -->
  <div id="menu" class="screen active">
    <img src="photo1.jpg.png" alt="Фото">
    <button id="startBtn">Начать игру</button>
  </div>

  <!-- ИГРА -->
  <div id="game" class="screen">
    <div class="photos-row">
      <img src="photo2.jpg.jpg" alt="Парень в наушниках">
      <img src="photo3.jpg.png" alt="Фото 3">
    </div>
    <h1>ТЫ ОБОССАН!!!!!:))</h1>
  </div>

<script>
  document.getElementById('startBtn').addEventListener('click', function () {
    document.getElementById('menu').classList.remove('active');
    document.getElementById('game').classList.add('active');
  });
</script>

</body>
</html>
